services:
  db-usuarios:
    image: postgres:15
    container_name: db-usuarios
    environment:
      POSTGRES_USER: user_sanos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_usuarios
    ports:
      - "5433:5432"
    volumes:
      - vol-usuarios:/var/lib/postgresql/data
    networks:
      - sanosysalvos-net

  db-mascotas:
    image: postgres:15
    container_name: db-mascotas
    environment:
      POSTGRES_USER: user_sanos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_mascotas
    ports:
      - "5434:5432"
    volumes:
      - vol-mascotas:/var/lib/postgresql/data
    networks:
      - sanosysalvos-net

  db-geolocalizacion:
    image: postgres:15
    container_name: db-geolocalizacion
    environment:
      POSTGRES_USER: user_sanos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_geo
    ports:
      - "5435:5432"
    volumes:
      - vol-geo:/var/lib/postgresql/data
    networks:
      - sanosysalvos-net

  db-coincidencias:
    image: postgres:15
    container_name: db-coincidencias
    environment:
      POSTGRES_USER: user_sanos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_coincidencias
    ports:
      - "5436:5432"
    volumes:
      - vol-coincidencias:/var/lib/postgresql/data
    networks:
      - sanosysalvos-net

  db-reportes:
    image: postgres:15
    container_name: db-reportes
    environment:
      POSTGRES_USER: user_sanos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_reportes
    ports:
      - "5437:5432"
    volumes:
      - vol-reportes:/var/lib/postgresql/data
    networks:
      - sanosysalvos-net

  rabbitmq-sanos:
    image: rabbitmq:3-management
    container_name: rabbitmq-sanos
    ports:
      - "5672:5672"   
      - "15672:15672" 
    networks:
      - sanosysalvos-net

  # --- INFRAESTRUCTURA DE SONARQUBE ---
  db-sonarqube:
    image: postgres:16-alpine
    container_name: db-sonarqube
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_password_1234
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks:
      - sanosysalvos-net

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      - db-sonarqube
    environment:
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_password_1234
      SONAR_JDBC_URL: jdbc:postgresql://db-sonarqube:5432/sonar
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks:
      - sanosysalvos-net

  # --- MICROSERVICIOS ---
  eurekaserver:
    build: ./eurekaserver
    container_name: eurekaserver
    ports:
      - "8761:8761"
    networks:
      - sanosysalvos-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - eurekaserver
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
    networks:
      - sanosysalvos-net

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "9000:9000"
    depends_on:
      - eurekaserver
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
    networks:
      - sanosysalvos-net

  ms-usuarios:
    build: ./ms-usuarios
    container_name: ms-usuarios
    ports:
      - "8081:8081"
    depends_on:
      - eurekaserver
      - db-usuarios
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-usuarios:5432/db_usuarios
      SPRING_DATASOURCE_USERNAME: user_sanos
      SPRING_DATASOURCE_PASSWORD: password123
    networks:
      - sanosysalvos-net

  ms-mascotas:
    build: ./ms_mascotas
    container_name: ms-mascotas
    ports:
      - "8082:8082"
    depends_on:
      - eurekaserver
      - db-mascotas
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-mascotas:5432/db_mascotas
      SPRING_DATASOURCE_USERNAME: user_sanos
      SPRING_DATASOURCE_PASSWORD: password123
    networks:
      - sanosysalvos-net

  ms-geolocalizacion:
    build: ./ms-geolocalizacion
    container_name: ms-geolocalizacion
    ports:
      - "8083:8083"
    depends_on:
      - eurekaserver
      - db-geolocalizacion
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-geolocalizacion:5432/db_geo
      SPRING_DATASOURCE_USERNAME: user_sanos
      SPRING_DATASOURCE_PASSWORD: password123
    networks:
      - sanosysalvos-net

  ms-coincidencias:
    build: ./ms-coincidencias
    container_name: ms-coincidencias
    ports:
      - "8084:8084"
    depends_on:
      - eurekaserver
      - db-coincidencias
      - rabbitmq-sanos
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-coincidencias:5432/db_coincidencias
      SPRING_DATASOURCE_USERNAME: user_sanos
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_RABBITMQ_HOST: rabbitmq-sanos
    networks:
      - sanosysalvos-net

  ms-reportes:
    build: ./ms-reportes
    container_name: ms-reportes
    ports:
      - "8085:8085"
    depends_on:
      - eurekaserver
      - db-reportes
      - rabbitmq-sanos
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-reportes:5432/db_reportes
      SPRING_DATASOURCE_USERNAME: user_sanos
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_RABBITMQ_HOST: rabbitmq-sanos
    networks:
      - sanosysalvos-net

networks:
  sanosysalvos-net:
    driver: bridge

volumes:
  vol-usuarios:
  vol-mascotas:
  vol-geo:
  vol-coincidencias:
  vol-reportes:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs: