services:

  # ══════════════════════════════════════════════
  #  BASES DE DATOS
  # ══════════════════════════════════════════════

  db-usuarios:
    image: postgres:15
    container_name: db-usuarios
    environment:
      POSTGRES_USER: user_sanos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_usuarios
    ports:
      - "5433:5432"
    volumes:
      - vol-usuarios:/var/lib/postgresql/data
    networks:
      - sanosysalvos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_sanos -d db_usuarios"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-mascotas:
    image: postgres:15
    container_name: db-mascotas
    environment:
      POSTGRES_USER: user_sanos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_mascotas
    ports:
      - "5434:5432"
    volumes:
      - vol-mascotas:/var/lib/postgresql/data
    networks:
      - sanosysalvos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_sanos -d db_mascotas"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-geolocalizacion:
    image: postgres:15
    container_name: db-geolocalizacion
    environment:
      POSTGRES_USER: user_sanos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_geo
    ports:
      - "5435:5432"
    volumes:
      - vol-geo:/var/lib/postgresql/data
    networks:
      - sanosysalvos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_sanos -d db_geo"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-coincidencias:
    image: postgres:15
    container_name: db-coincidencias
    environment:
      POSTGRES_USER: user_sanos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_coincidencias
    ports:
      - "5436:5432"
    volumes:
      - vol-coincidencias:/var/lib/postgresql/data
    networks:
      - sanosysalvos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_sanos -d db_coincidencias"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-reportes:
    image: postgres:15
    container_name: db-reportes
    environment:
      POSTGRES_USER: user_sanos
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_reportes
    ports:
      - "5437:5432"
    volumes:
      - vol-reportes:/var/lib/postgresql/data
    networks:
      - sanosysalvos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_sanos -d db_reportes"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ══════════════════════════════════════════════
  #  MENSAJERÍA
  # ══════════════════════════════════════════════

  rabbitmq-sanos:
    image: rabbitmq:3-management
    container_name: rabbitmq-sanos
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - sanosysalvos-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ══════════════════════════════════════════════
  #  SONARQUBE (herramienta de análisis de calidad)
  # ══════════════════════════════════════════════

  db-sonarqube:
    image: postgres:16-alpine
    container_name: db-sonarqube
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar_password_1234
      POSTGRES_DB: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    networks:
      - sanosysalvos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      db-sonarqube:
        condition: service_healthy
    environment:
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar_password_1234
      SONAR_JDBC_URL: jdbc:postgresql://db-sonarqube:5432/sonar
    ports:
      - "9000:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks:
      - sanosysalvos-net

  # ══════════════════════════════════════════════
  #  MICROSERVICIOS — INFRAESTRUCTURA
  # ══════════════════════════════════════════════

  eurekaserver:
    build: ./eurekaserver
    container_name: eurekaserver
    ports:
      - "8761:8761"
    networks:
      - sanosysalvos-net
    healthcheck:
      # wget está disponible en eclipse-temurin alpine
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      eurekaserver:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
    networks:
      - sanosysalvos-net
    restart: on-failure

  # Nota: auth-service corre internamente en el puerto 9000.
  # El mapeo al host usa 9090 para no colisionar con SonarQube (9000).
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "9090:9000"
    depends_on:
      eurekaserver:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
    networks:
      - sanosysalvos-net
    restart: on-failure

  # ══════════════════════════════════════════════
  #  MICROSERVICIOS — NEGOCIO
  # ══════════════════════════════════════════════

  ms-usuarios:
    build: ./ms-usuarios
    container_name: ms-usuarios
    ports:
      - "8081:8081"
    depends_on:
      eurekaserver:
        condition: service_healthy
      db-usuarios:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-usuarios:5432/db_usuarios
      SPRING_DATASOURCE_USERNAME: user_sanos
      SPRING_DATASOURCE_PASSWORD: password123
    networks:
      - sanosysalvos-net
    restart: on-failure

  ms-mascotas:
    build: ./ms_mascotas
    container_name: ms-mascotas
    ports:
      - "8082:8082"
    depends_on:
      eurekaserver:
        condition: service_healthy
      db-mascotas:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-mascotas:5432/db_mascotas
      SPRING_DATASOURCE_USERNAME: user_sanos
      SPRING_DATASOURCE_PASSWORD: password123
    networks:
      - sanosysalvos-net
    restart: on-failure

  ms-geolocalizacion:
    build: ./ms-geolocalizacion
    container_name: ms-geolocalizacion
    ports:
      - "8083:8083"
    depends_on:
      eurekaserver:
        condition: service_healthy
      db-geolocalizacion:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-geolocalizacion:5432/db_geo
      SPRING_DATASOURCE_USERNAME: user_sanos
      SPRING_DATASOURCE_PASSWORD: password123
    networks:
      - sanosysalvos-net
    restart: on-failure

  ms-coincidencias:
    build: ./ms-coincidencias
    container_name: ms-coincidencias
    ports:
      - "8084:8084"
    depends_on:
      eurekaserver:
        condition: service_healthy
      db-coincidencias:
        condition: service_healthy
      rabbitmq-sanos:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-coincidencias:5432/db_coincidencias
      SPRING_DATASOURCE_USERNAME: user_sanos
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_RABBITMQ_HOST: rabbitmq-sanos
    networks:
      - sanosysalvos-net
    restart: on-failure

  ms-reportes:
    build: ./ms-reportes
    container_name: ms-reportes
    ports:
      - "8085:8085"
    depends_on:
      eurekaserver:
        condition: service_healthy
      db-reportes:
        condition: service_healthy
      rabbitmq-sanos:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eurekaserver:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db-reportes:5432/db_reportes
      SPRING_DATASOURCE_USERNAME: user_sanos
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_RABBITMQ_HOST: rabbitmq-sanos
    networks:
      - sanosysalvos-net
    restart: on-failure

networks:
  sanosysalvos-net:
    driver: bridge

volumes:
  vol-usuarios:
  vol-mascotas:
  vol-geo:
  vol-coincidencias:
  vol-reportes:
  sonar-db-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:
